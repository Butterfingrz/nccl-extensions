# Use one CUDA 13.4 build for both driver environments.
.cft_ci:
  variables:
    CI_BUILDS_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/builds/${CI_JOB_SUBPATH}"
    CFT_CONTAINER_IMAGE: "/lustre/fsw/coreai_libraries_nccl/toolkits/docker_sqsh/nccl_build_tools-2.0.0-c13.0.2-u24.04_arm.sqsh"
    CFT_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-13.4"
    SLURM_ACCOUNT: "coreai_libraries_nccl"
    SLURM_PARTITION: "batch"
  before_script:
    - export CFT_INSTALL_DIR="${CI_PROJECT_DIR}/cft_install"
    - export CFT_CONTAINER_MOUNTS="${CI_PROJECT_DIR}:${CI_PROJECT_DIR},/lustre/fsw/coreai_libraries_nccl/toolkits:/lustre/fsw/coreai_libraries_nccl/toolkits"

build_cft_cuda134:
  extends: .cft_ci
  stage: build
  tags: [polyphe]
  timeout: 2h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl
      artifacts: true
  script:
    - >
      srun --account="${SLURM_ACCOUNT}" -p "${SLURM_PARTITION}"
      -N1 -n1 --cpus-per-task=32 --exclusive -t 01:00:00
      --container-image="${CFT_CONTAINER_IMAGE}"
      --container-mounts="${CFT_CONTAINER_MOUNTS}"
      --container-workdir="${CI_PROJECT_DIR}"
      env CUDA_HOME="${CFT_CUDA_HOME}"
      bash nccl_ep/ci/build_cft_ci.sh
  artifacts:
    paths:
      - cft_install/include/
      - cft_install/lib/
      - cft_install/test/nccl_ep/
      - cft_install/provenance.txt
      - cft_install/SHA256SUMS
    expire_in: 7 days

.test_cft_ci:
  extends: .cft_ci
  stage: integration_test
  timeout: 2h
  needs:
    - job: build_cft_cuda134
      artifacts: true
  script:
    - >
      salloc --account="${SLURM_ACCOUNT}" -p "${SLURM_PARTITION}"
      -N1 --ntasks-per-node=4 --exclusive -t 00:20:00
      bash nccl_ep/ci/run_cft_ci_tests.sh "${CFT_EXPECT}"
  artifacts:
    when: always
    paths:
      - cft-ci-results/
    expire_in: 7 days

test_cft_supported:
  extends: .test_cft_ci
  tags: [polyphe]
  variables:
    CFT_EXPECT: supported

test_cft_older_driver:
  extends: .test_cft_ci
  tags: [ptyche]
  variables:
    CFT_EXPECT: missing-api
    CFT_CONTAINER_IMAGE: "/lustre/fsw/coreai_libraries_nccl/toolkits/docker_sqsh/nccl_build_tools-2.0.0-c13.0.2-u24.04.sqsh"
    # The artifact retains its CUDA 13.4 runtime; STORE kernels use this JIT toolkit.
    CFT_CUDA_HOME: "/usr/local/cuda"
